<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SAFEWARE</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1B1F24;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #23282F;
            padding: 2rem;
            border-radius: 2px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 { margin-top: 0; text-align: center; }
        p.subtitle {
            font-size: 0.875rem;
            color: #98A2AE;
            text-align: center;
            margin-bottom: 1.25rem;
        }
        label { display: block; font-size: 0.75rem; color: #98A2AE; margin-bottom: 0.25rem; }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid #2A3038;
            background: #1B1F24;
            color: white;
            border-radius: 2px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #3B5566;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 2px;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: #313842; }
        button:disabled { background: #2A3038; cursor: not-allowed; }
        .msg { font-size: 0.875rem; margin-top: 0.75rem; text-align: center; }
        .msg.error { color: #e0a59e; }
        .msg.success { color: #5fae8a; }
        a.logout-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #98A2AE;
            text-decoration: none;
        }
        a.logout-link:hover { color: #98A2AE; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Change Password</h2>
        <p class="subtitle">You are using a default password and must change it to continue.</p>
        <form id="changeForm" autocomplete="off">
            <label for="old_password">Current Password</label>
            <input type="password" id="old_password" name="old_password" placeholder="Current Password" required autocomplete="current-password">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="New Password (min 8 chars)" required autocomplete="new-password">
            <button type="submit" id="submitBtn">Update Password</button>
        </form>
        <div class="msg" id="msg"></div>
        <a href="/auth/logout" class="logout-link">Cancel &amp; log out</a>
    </div>

    <script>
        function getCookie(name) {
            var matches = document.cookie.match(new RegExp(
                "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
            ));
            return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        document.getElementById('changeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('submitBtn');
            var msgEl = document.getElementById('msg');
            var old_password = document.getElementById('old_password').value;
            var new_password = document.getElementById('new_password').value;

            btn.disabled = true;
            btn.textContent = 'Updating...';
            msgEl.textContent = '';
            msgEl.className = 'msg';

            try {
                var token = getCookie('csrf_token');
                var res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-Token': token || ''
                    },
                    body: JSON.stringify({ old_password: old_password, new_password: new_password })
                });
                var data = await res.json();
                if (res.ok && data.success) {
                    msgEl.textContent = 'Password changed successfully. Redirecting to login...';
                    msgEl.className = 'msg success';
                    setTimeout(function() { window.location.href = '/auth/logout'; }, 1500);
                } else {
                    msgEl.textContent = data.error || 'An error occurred. Please try again.';
                    msgEl.className = 'msg error';
                    btn.disabled = false;
                    btn.textContent = 'Update Password';
                }
            } catch (err) {
                msgEl.textContent = 'Network error. Please check your connection and try again.';
                msgEl.className = 'msg error';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
